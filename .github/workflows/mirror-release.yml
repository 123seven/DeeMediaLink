name: Mirror DeeMedia Link 2.0.0 to Alibaba Cloud

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deemedia-link-publish
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REGISTRY: crpi-2px6rtvkdjv8fx9b.cn-chengdu.personal.cr.aliyuncs.com
      IMAGE: crpi-2px6rtvkdjv8fx9b.cn-chengdu.personal.cr.aliyuncs.com/feifeiduck/deemedia-link
      STAGING_TAG: mirror-2.0.0-${{ github.run_id }}-${{ github.run_attempt }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Verify official release
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REPOSITORY,,}" == 123seven/deemedialink ]]
          [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]
          gh release view v2.0.0 --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName |
            jq -e '.tagName == "v2.0.0" and (.isDraft | not) and (.isPrerelease | not)' >/dev/null
      - uses: actions/checkout@v4
        with:
          ref: v2.0.0
          persist-credentials: false
      - name: Download and verify release binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir image-context
          cp Dockerfile entrypoint.sh image-context/
          gh release download v2.0.0 --repo "$GITHUB_REPOSITORY" --dir image-context \
            --pattern deemedia-link-linux-amd64 --pattern deemedia-link-linux-arm64 --pattern SHA256SUMS
          cd image-context
          python3 - <<'PY'
          import re
          lines = open('SHA256SUMS', encoding='ascii').read().splitlines()
          expected = {'deemedia-link-linux-amd64', 'deemedia-link-linux-arm64'}
          found = set()
          for line in lines:
              match = re.fullmatch(r'[0-9a-fA-F]{64} [ *](deemedia-link-linux-(?:amd64|arm64))', line)
              if not match or match.group(1) in found:
                  raise SystemExit('Invalid SHA256SUMS')
              found.add(match.group(1))
          if found != expected:
              raise SystemExit('SHA256SUMS must contain exactly both binaries')
          PY
          sha256sum --check --strict SHA256SUMS
          readelf -h deemedia-link-linux-amd64 | grep -Eq 'Machine:.*Advanced Micro Devices X86-64'
          readelf -h deemedia-link-linux-arm64 | grep -Eq 'Machine:.*AArch64'
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: crpi-2px6rtvkdjv8fx9b.cn-chengdu.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
      - name: Build staging image
        uses: docker/build-push-action@v6
        with:
          context: ./image-context
          platforms: linux/amd64,linux/arm64
          push: true
          tags: crpi-2px6rtvkdjv8fx9b.cn-chengdu.personal.cr.aliyuncs.com/feifeiduck/deemedia-link:mirror-2.0.0-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify anonymous image index
        shell: bash
        run: |
          set -euo pipefail
          docker logout "$REGISTRY"
          docker buildx imagetools inspect --raw "$IMAGE:$STAGING_TAG" > /tmp/image-index.json
          jq -e '[.manifests[]?.platform | select(.os == "linux") | .architecture] | (index("amd64") != null and index("arm64") != null)' /tmp/image-index.json >/dev/null
      - uses: docker/login-action@v3
        with:
          registry: crpi-2px6rtvkdjv8fx9b.cn-chengdu.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
      - name: Create 2.0.0 tag if absent
        shell: bash
        run: |
          set -euo pipefail
          # Fail closed on errors other than a missing manifest. Never touch latest.
          if docker buildx imagetools inspect "$IMAGE:2.0.0" > /tmp/existing-image.txt 2>&1; then
            echo '2.0.0 already exists; refusing to overwrite it.' >&2
            exit 1
          fi
          if ! grep -Eqi 'manifest unknown|manifest_unknown|manifest[^[:cntrl:]]*not found' /tmp/existing-image.txt; then
            cat /tmp/existing-image.txt >&2
            echo 'Could not prove the 2.0.0 tag is absent; refusing to write it.' >&2
            exit 1
          fi
          docker buildx imagetools create --tag "$IMAGE:2.0.0" "$IMAGE:$STAGING_TAG"
      - name: Verify final tag anonymously
        shell: bash
        run: |
          set -euo pipefail
          docker logout "$REGISTRY"
          docker buildx imagetools inspect --raw "$IMAGE:2.0.0" > /tmp/final-image-index.json
          jq -e '[.manifests[]?.platform | select(.os == "linux") | .architecture] | (index("amd64") != null and index("arm64") != null)' /tmp/final-image-index.json >/dev/null
